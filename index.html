<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webcam Carrousel</title>
  <style>
    :root {
      --pan-duration: 56s;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: sans-serif;
      cursor: none;
    }

    /* Twee lagen op elkaar. De actieve laag ligt BOVENOP en er ligt niets overheen.
       De volgende webcam wordt eronder (z-index lager) voorgeladen. */
    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
    }
    .layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      z-index: 1;
    }
    .layer iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .webcam-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: none;
      pointer-events: none;
    }
    .webcam-img.panoramic {
      animation: pan-panorama var(--pan-duration) ease-in-out infinite alternate;
    }
    @keyframes pan-panorama {
      0% { object-position: 10% 50%; }
      100% { object-position: 90% 50%; }
    }

    /* Onzichtbare laag die een klik opvangt om te pauzeren/hervatten (click_pause in config.file) */
    #click-catcher {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      background: transparent;
    }
    #click-catcher.off {
      display: none;
    }
    #pause-badge {
      position: fixed;
      top: 22px;
      right: 24px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.72);
      color: #00d2ff;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid rgba(0, 210, 255, 0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }
    #pause-badge.visible {
      opacity: 1;
    }

    /* Naam van de webcam: alleen kort zichtbaar na het wisselen (zie label_seconds in config.file) */
    #webcam-label {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.72);
      color: #f2f5f8;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: calc(100% - 48px);
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }
    #webcam-label.visible {
      opacity: 1;
    }

    #update-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9998;
      background: rgba(0, 0, 0, 0.85);
      color: #00d2ff;
      border: 1px solid #00d2ff;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease-in-out;
    }
    #update-toast.visible {
      opacity: 1;
    }

    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b0d12;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 99999;
      text-align: center;
      padding: 20px;
      outline: none;
    }
    .start-box {
      border: 1px solid rgba(0, 210, 255, 0.35);
      background: rgba(255, 255, 255, 0.04);
      padding: 36px 48px;
      border-radius: 16px;
      max-width: 640px;
    }
    .start-box h1 {
      margin-bottom: 12px;
      font-size: 1.8em;
    }
    .start-box p {
      color: #bbb;
      margin-top: 6px;
    }
    #info-text {
      color: #00d2ff;
      font-weight: bold;
      margin-top: 20px;
      font-size: 1.1em;
    }
    #version-text {
      color: #8fa3b8;
      margin-top: 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <div id="start-overlay" tabindex="0" onclick="startApp()">
    <div class="start-box">
      <h1>Klik / Tik of druk op OK om te starten</h1>
      <p>Dit activeert de webcam carrousel op volledig scherm</p>
      <p id="info-text">Instellingen laden...</p>
      <p id="version-text"></p>
    </div>
  </div>

  <div id="stage">
    <div class="layer" id="layer0">
      <iframe id="frame0" src="about:blank" tabindex="-1" allow="autoplay *; fullscreen *; accelerometer *; gyroscope *; encrypted-media *" allowfullscreen></iframe>
      <img class="webcam-img" id="img0" alt="" />
    </div>
    <div class="layer" id="layer1">
      <iframe id="frame1" src="about:blank" tabindex="-1" allow="autoplay *; fullscreen *; accelerometer *; gyroscope *; encrypted-media *" allowfullscreen></iframe>
      <img class="webcam-img" id="img1" alt="" />
    </div>
  </div>

  <div id="click-catcher"></div>
  <div id="pause-badge">⏸ Gepauzeerd – klik om verder te gaan</div>
  <div id="webcam-label"></div>
  <div id="update-toast"></div>

  <script>
    // ---------- Instellingen (uit config.file) ----------
    let intervalInSeconds = 5;        // rotating_time
    let checkIntervalInSeconds = 120; // check_interval
    let preloadEnabled = true;        // preload = on/off
    let labelSeconds = 5;             // label_seconds (0 = nooit tonen, always = altijd tonen)
    let panSeconds = 56;              // pan_seconds (schuifsnelheid van panorama-afbeeldingen)
    let nudgeEnabled = true;          // nudge = on/off (geeft de webcam-iframe een duwtje, zie nudgeLayer)
    let focusFrameEnabled = true;     // focus_frame = on/off (geeft de actieve webcam-iframe de toetsenbordfocus)
    let clickPauseEnabled = true;     // click_pause = on/off (één klik pauzeert, nog een klik hervat)

    let webcamItems = [];

    // ---------- Status ----------
    const FADE_MS = 450;
    let activeLayer = 0;
    let cur = 0;
    let isStarted = false;
    let paused = false;
    let initPromise = null;

    let tickTimer = null;
    let preloadTimer = null;
    let syncTimer = null;
    let labelTimer = null;
    let toastTimer = null;
    let fadeTimer = null;
    let pendingFinalize = null;

    const layers = [0, 1].map(i => ({
      el: document.getElementById('layer' + i),
      frame: document.getElementById('frame' + i),
      img: document.getElementById('img' + i),
      item: -1 // welk item uit webcamItems zit in deze laag (-1 = leeg)
    }));

    const overlay = document.getElementById('start-overlay');
    const infoText = document.getElementById('info-text');
    const versionText = document.getElementById('version-text');
    const labelEl = document.getElementById('webcam-label');
    const toastEl = document.getElementById('update-toast');
    const clickCatcher = document.getElementById('click-catcher');
    const pauseBadge = document.getElementById('pause-badge');

    clickCatcher.addEventListener('click', () => {
      if (isStarted) togglePause();
    });

    function getFormattedLastModified() {
      const raw = document.lastModified;
      const parsed = raw ? new Date(raw) : null;
      if (parsed && !isNaN(parsed.getTime())) {
        return parsed.toLocaleString('nl-NL', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
      }
      return raw || 'Onbekend';
    }
    versionText.textContent = `Versie index.html: ${getFormattedLastModified()}`;

    // ---------- Afbeeldingen (jpg/png/Roundshot): eigen CSS-pan voor panorama's ----------
    function isDirectImageUrl(rawUrl) {
      try {
        const urlObj = new URL(rawUrl);
        const path = urlObj.pathname.toLowerCase();
        if (/\.(jpe?g|png|webp|gif)$/i.test(path)) return true;
        if ((urlObj.hostname === 'backend.roundshot.com' || urlObj.hostname === 'storage.roundshot.com') && path.includes('/cams/')) {
          return true;
        }
      } catch (e) {}
      return false;
    }

    function buildImageUrl(rawUrl) {
      try {
        const urlObj = new URL(rawUrl);
        if (urlObj.hostname === 'backend.roundshot.com') {
          urlObj.pathname = urlObj.pathname.replace(/\/(original|full2?|default)$/i, '/half');
        }
        urlObj.searchParams.set('_cb', Date.now().toString());
        return urlObj.toString();
      } catch (e) {
        return rawUrl;
      }
    }

    layers.forEach(L => {
      L.img.addEventListener('load', () => {
        if (L.img.naturalWidth > 0 && L.img.naturalHeight > 0 && (L.img.naturalWidth / L.img.naturalHeight) > 2.1) {
          L.img.classList.add('panoramic');
        } else {
          L.img.classList.remove('panoramic');
        }
      });
      L.img.addEventListener('error', () => {
        if (L.img.src && L.img.src.includes('/half')) {
          L.img.src = L.img.src.replace('/half', '/quarter');
        }
      });
    });

    // ---------- Namen uit URL's ----------
    function formatSlug(text) {
      return text
        .replace(/[-_+]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .split(' ')
        .map(w => w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : '')
        .join(' ');
    }

    function isGenericOrId(segment) {
      const lower = segment.toLowerCase();
      const generic = [
        'webcam', 'webcams', 'cam', 'cams', 'camera', 'cameras',
        'live', 'livecam', 'livecams', 'stream', 'streams', 'embed',
        'player', 'view', 'viewer', 'watch', 'video', 'videos',
        'index', 'home', 'default', 'main', 'public', 'media',
        'image', 'images', 'img', 'snap', 'snapshot', 'latest',
        'current', 'full', 'half', 'quarter', 'hd', '4k', 'nl', 'en', 'fr', 'de', 'it', 'es',
        'hiver', 'winter', 'ete', 'summer', 'ski', 'station', 'resort',
        'webtv', 'panomax', 'skaping', 'feratel', 'bergfex', 'roundshot',
        'foto-webcam', 'youtube', 'youtu'
      ];
      if (generic.includes(lower)) return true;
      if (/^(c|cam|id)?\d+$/.test(lower)) return true;
      if (lower.length >= 7 && /^[a-z0-9]+$/.test(lower) && /\d/.test(lower)) return true;
      return false;
    }

    function extractWebcamName(rawUrl) {
      try {
        const urlObj = new URL(rawUrl);

        const pathParts = urlObj.pathname
          .split('/')
          .map(seg => {
            try { return decodeURIComponent(seg); } catch (e) { return seg; }
          })
          .map(seg => seg.replace(/\.(html?|php|aspx?|jsp|jpe?g|png|webp|m3u8|mp4)$/i, '').trim())
          .filter(seg => seg.length > 1 && !isGenericOrId(seg));

        if (pathParts.length > 0) {
          const relevant = pathParts.slice(-2).map(formatSlug);
          if (relevant.length === 2 && relevant[0].toLowerCase() === relevant[1].toLowerCase()) {
            return relevant[0];
          }
          return relevant.join(' - ');
        }

        const queryKeys = ['name', 'title', 'cam', 'webcam', 'location', 'station', 'resort'];
        for (const key of queryKeys) {
          const val = urlObj.searchParams.get(key);
          if (val && val.length > 1 && !isGenericOrId(val)) {
            return formatSlug(val);
          }
        }

        const hostParts = urlObj.hostname
          .replace(/^www\./i, '')
          .split('.')
          .filter(part => part.length > 2 && !isGenericOrId(part));

        if (hostParts.length > 0) {
          return formatSlug(hostParts[0]);
        }
      } catch (e) {}

      return 'Webcam';
    }

    // Regelformaten in webcams.list:  url   |   naam=url   |   url|naam
    // Optioneel " @fresh" aan het eind: die webcam wordt niet voorgeladen, maar pas geladen als hij aan de beurt is.
    function parseWebcamLine(line) {
      let fresh = false;
      if (/\s@fresh\s*$/i.test(line)) {
        fresh = true;
        line = line.replace(/\s@fresh\s*$/i, '').trim();
      }
      const result = parseWebcamLineInner(line);
      result.fresh = fresh;
      return result;
    }

    function parseWebcamLineInner(line) {
      const eqIndex = line.indexOf('=');
      if (eqIndex > 0 && !/^https?:\/\//i.test(line)) {
        const customName = line.slice(0, eqIndex).trim();
        const urlPart = line.slice(eqIndex + 1).trim();
        if (urlPart) {
          return {
            url: urlPart,
            name: customName || extractWebcamName(urlPart)
          };
        }
      }

      const pipeIndex = line.indexOf('|');
      if (pipeIndex !== -1) {
        const urlPart = line.slice(0, pipeIndex).trim();
        const customName = line.slice(pipeIndex + 1).trim();
        return {
          url: urlPart,
          name: customName || extractWebcamName(urlPart)
        };
      }

      return {
        url: line,
        name: extractWebcamName(line)
      };
    }

    function itemsEqual(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (a[i].url !== b[i].url || a[i].name !== b[i].name || a[i].fresh !== b[i].fresh) return false;
      }
      return true;
    }

    // ---------- Hulpfuncties ----------
    function requestNativeFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('visible');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('visible');
      }, 3500);
    }

    function showLabel(name) {
      labelEl.textContent = name || '';
      if (labelTimer) clearTimeout(labelTimer);
      if (!name || labelSeconds === 0) {
        labelEl.classList.remove('visible');
        return;
      }
      labelEl.classList.add('visible');
      if (labelSeconds > 0) {
        labelTimer = setTimeout(() => {
          labelEl.classList.remove('visible');
        }, labelSeconds * 1000);
      }
    }

    // ---------- Config en lijst ophalen ----------
    async function fetchRemoteData() {
      const data = {
        interval: intervalInSeconds,
        checkInterval: checkIntervalInSeconds,
        preload: preloadEnabled,
        label: labelSeconds,
        pan: panSeconds,
        nudge: nudgeEnabled,
        focusFrame: focusFrameEnabled,
        clickPause: clickPauseEnabled,
        items: null
      };

      try {
        const configResp = await fetch('config.file?t=' + Date.now());
        if (configResp.ok) {
          const raw = await configResp.text();
          const text = raw
            .split(/\r?\n/)
            .filter(l => !l.trim().startsWith('#'))
            .join('\n');

          const timeMatch = text.match(/rotating_time\s*=\s*(\d+)/i);
          if (timeMatch) data.interval = Math.max(1, parseInt(timeMatch[1], 10));

          const checkMatch = text.match(/check_interval\s*=\s*(\d+)/i);
          if (checkMatch) data.checkInterval = Math.max(15, parseInt(checkMatch[1], 10));

          const preloadMatch = text.match(/preload\s*=\s*(on|off|true|false|yes|no|1|0|aan|uit)/i);
          if (preloadMatch) data.preload = /^(on|true|yes|1|aan)$/i.test(preloadMatch[1]);

          const labelMatch = text.match(/label_seconds\s*=\s*(\d+|always)/i);
          if (labelMatch) data.label = /always/i.test(labelMatch[1]) ? -1 : parseInt(labelMatch[1], 10);

          const panMatch = text.match(/pan_seconds\s*=\s*(\d+)/i);
          if (panMatch) data.pan = Math.max(5, parseInt(panMatch[1], 10));

          const nudgeMatch = text.match(/nudge\s*=\s*(on|off|true|false|yes|no|1|0|aan|uit)/i);
          if (nudgeMatch) data.nudge = /^(on|true|yes|1|aan)$/i.test(nudgeMatch[1]);

          const focusMatch = text.match(/focus_frame\s*=\s*(on|off|true|false|yes|no|1|0|aan|uit)/i);
          if (focusMatch) data.focusFrame = /^(on|true|yes|1|aan)$/i.test(focusMatch[1]);

          const clickMatch = text.match(/click_pause\s*=\s*(on|off|true|false|yes|no|1|0|aan|uit)/i);
          if (clickMatch) data.clickPause = /^(on|true|yes|1|aan)$/i.test(clickMatch[1]);
        }
      } catch (err) {
        console.warn("Kon config.file niet ophalen:", err);
      }

      try {
        const listResp = await fetch('webcams.list?t=' + Date.now());
        if (listResp.ok) {
          const text = await listResp.text();
          data.items = text
            .split(/\r?\n/)
            .map(line => line.trim())
            .filter(line => line.length > 0 && !line.startsWith('#'))
            .map(parseWebcamLine);
        }
      } catch (err) {
        console.warn("Kon webcams.list niet ophalen:", err);
      }

      return data;
    }

    function applySettings(data) {
      intervalInSeconds = data.interval;
      checkIntervalInSeconds = data.checkInterval;
      preloadEnabled = data.preload;
      labelSeconds = data.label;
      panSeconds = data.pan;
      nudgeEnabled = data.nudge;
      focusFrameEnabled = data.focusFrame;
      clickPauseEnabled = data.clickPause;
      clickCatcher.classList.toggle('off', !clickPauseEnabled);
      document.documentElement.style.setProperty('--pan-duration', panSeconds + 's');
    }

    // ---------- Lagen ----------
    function clearLayer(b) {
      const L = layers[b];
      L.item = -1;
      L.frame.src = 'about:blank';
      L.frame.style.display = 'block';
      L.img.removeAttribute('src');
      L.img.classList.remove('panoramic');
      L.img.style.display = 'none';
    }

    function loadLayer(b, idx) {
      const L = layers[b];
      const item = webcamItems[idx];
      if (!item) {
        clearLayer(b);
        return;
      }
      L.item = idx;
      L.img.classList.remove('panoramic');

      if (isDirectImageUrl(item.url)) {
        L.frame.src = 'about:blank';
        L.frame.style.display = 'none';
        L.img.style.display = 'block';
        L.img.src = buildImageUrl(item.url);
      } else {
        L.img.removeAttribute('src');
        L.img.style.display = 'none';
        L.frame.style.display = 'block';
        L.frame.src = item.url;
      }
    }

    // Sommige viewers (zoals Skaping) beginnen pas te draaien/schuiven na een muisbeweging in de iframe.
    // We kunnen geen muisbeweging in een iframe van een andere site simuleren, maar als de iframe 1px
    // verschuift terwijl de cursor op het scherm staat, stuurt Chromium zelf vaak een 'nep'-muisbeweging
    // naar wat er onder de cursor ligt. Dat proberen we hier, een paar keer na het wisselen.
    function nudgeLayer(b) {
      const el = layers[b].el;
      el.style.left = '1px';
      setTimeout(() => { el.style.left = '0px'; }, 120);
    }

    // Een pagina die je direct opent heeft de focus; een iframe krijgt die normaal niet. Sommige viewers
    // (zoals Skaping) beginnen pas als hun venster actief is. Hier geven we de actieve iframe die focus.
    // Let op: met de focus in de iframe komen toetsen van de afstandsbediening niet meer bij deze pagina
    // aan (bij een muis/cursor maakt dat niet uit).
    function focusLayer(b) {
      const f = layers[b].frame;
      try {
        f.focus();
        if (f.contentWindow) f.contentWindow.focus();
      } catch (e) {}
    }

    function scheduleNudges() {
      if (!nudgeEnabled && !focusFrameEnabled) return;
      const b = activeLayer;
      [FADE_MS + 150, 1500, 3500, 7000].forEach(ms => {
        setTimeout(() => {
          if (activeLayer !== b || !isStarted) return;
          if (focusFrameEnabled) focusLayer(b);
          if (nudgeEnabled) nudgeLayer(b);
        }, ms);
      });
    }

    layers.forEach((L, b) => {
      L.frame.addEventListener('load', () => {
        if (!isStarted || !focusFrameEnabled || activeLayer !== b) return;
        if (!L.frame.src || L.frame.src === 'about:blank') return;
        setTimeout(() => { if (activeLayer === b) focusLayer(b); }, 300);
      });
    });

    function finishFade() {
      if (fadeTimer) {
        clearTimeout(fadeTimer);
        fadeTimer = null;
      }
      if (pendingFinalize) {
        const f = pendingFinalize;
        pendingFinalize = null;
        f();
      }
    }

    // Toont webcam idx: de standby-laag (waar de webcam meestal al is voorgeladen) komt met een fade
    // bovenop de huidige laag te liggen. Daarna wordt de oude laag leeggemaakt.
    function showIndex(idx) {
      const n = webcamItems.length;
      if (n === 0) return;
      idx = ((idx % n) + n) % n;

      finishFade();

      const outgoingIdx = activeLayer;
      const incomingIdx = 1 - activeLayer;

      if (layers[incomingIdx].item !== idx) {
        loadLayer(incomingIdx, idx);
      }

      const incoming = layers[incomingIdx].el;
      const outgoing = layers[outgoingIdx].el;

      incoming.style.transition = 'none';
      incoming.style.opacity = '0';
      incoming.style.zIndex = '3';
      outgoing.style.zIndex = '2';
      void incoming.offsetWidth; // forceer reflow zodat de fade start
      incoming.style.transition = `opacity ${FADE_MS}ms ease-in-out`;
      incoming.style.opacity = '1';

      activeLayer = incomingIdx;
      cur = idx;

      pendingFinalize = () => {
        outgoing.style.zIndex = '1';
        incoming.style.zIndex = '2';
        incoming.style.transition = '';
        clearLayer(outgoingIdx);
      };
      fadeTimer = setTimeout(finishFade, FADE_MS + 50);

      showLabel(webcamItems[idx].name);
      scheduleNudges();
      if (!paused) scheduleTick();
    }

    // Laadt de volgende webcam in de standby-laag (die ONDER de actieve laag ligt).
    function preloadNext() {
      if (!preloadEnabled || paused || webcamItems.length < 2) return;
      if (pendingFinalize) {
        preloadTimer = setTimeout(preloadNext, 300);
        return;
      }
      const idx = (cur + 1) % webcamItems.length;
      const item = webcamItems[idx];
      if (!item || item.fresh) return; // @fresh: pas laden als hij aan de beurt is

      const standby = 1 - activeLayer;
      if (layers[standby].item !== idx) {
        loadLayer(standby, idx);
      }
    }

    // Bij maar één webcam: alleen een afbeelding af en toe verversen (een iframe ververst zichzelf).
    function refreshSingleImage() {
      const item = webcamItems[cur];
      if (!item || !isDirectImageUrl(item.url)) return;
      const img = layers[activeLayer].img;
      const tmp = new Image();
      tmp.onload = () => { img.src = tmp.src; };
      tmp.src = buildImageUrl(item.url);
    }

    function scheduleTick() {
      if (tickTimer) clearTimeout(tickTimer);
      if (preloadTimer) clearTimeout(preloadTimer);
      if (paused || webcamItems.length === 0) return;

      if (webcamItems.length === 1) {
        tickTimer = setTimeout(() => {
          refreshSingleImage();
          scheduleTick();
        }, 300 * 1000);
        return;
      }

      const seconds = intervalInSeconds;
      tickTimer = setTimeout(() => showIndex(cur + 1), seconds * 1000);

      if (preloadEnabled) {
        const lead = Math.min(8, seconds * 0.7);
        preloadTimer = setTimeout(preloadNext, Math.max(0, seconds - lead) * 1000);
      }
    }

    function togglePause() {
      paused = !paused;
      pauseBadge.classList.toggle('visible', paused);
      if (paused) {
        if (tickTimer) clearTimeout(tickTimer);
        if (preloadTimer) clearTimeout(preloadTimer);
      } else {
        showToast("Hervat");
        scheduleTick();
      }
      // Een klik op de pagina haalt de focus uit de iframe; geef hem direct terug zodat de webcam blijft draaien.
      if (focusFrameEnabled) focusLayer(activeLayer);
    }

    // ---------- Updates uit config.file / webcams.list ----------
    function applyUpdate(data) {
      const checkChanged = data.checkInterval !== checkIntervalInSeconds;
      const oldUrl = webcamItems[cur] ? webcamItems[cur].url : null;

      applySettings(data);
      webcamItems = data.items;

      finishFade();
      clearLayer(1 - activeLayer); // voorgeladen inhoud kan verouderd zijn

      const newIdx = oldUrl ? webcamItems.findIndex(it => it.url === oldUrl) : -1;
      if (newIdx >= 0) {
        cur = newIdx;
        layers[activeLayer].item = newIdx;
        scheduleTick();
      } else {
        showIndex(0);
      }

      if (checkChanged) startBackgroundSync();
      showToast("Webcams & instellingen bijgewerkt");
    }

    async function checkForUpdates() {
      const data = await fetchRemoteData();
      if (!data.items || data.items.length === 0) return;

      const hasChanged =
        data.interval !== intervalInSeconds ||
        data.checkInterval !== checkIntervalInSeconds ||
        data.preload !== preloadEnabled ||
        data.label !== labelSeconds ||
        data.pan !== panSeconds ||
        data.nudge !== nudgeEnabled ||
        data.focusFrame !== focusFrameEnabled ||
        data.clickPause !== clickPauseEnabled ||
        !itemsEqual(data.items, webcamItems);

      if (hasChanged) applyUpdate(data);
    }

    function startBackgroundSync() {
      if (syncTimer) clearInterval(syncTimer);
      syncTimer = setInterval(checkForUpdates, checkIntervalInSeconds * 1000);
    }

    // ---------- Bediening (afstandsbediening / toetsenbord) ----------
    window.addEventListener('keydown', (e) => {
      const key = e.key;
      const code = e.keyCode;

      const isEnter = key === 'Enter' || key === ' ' || key === 'Select' || key === 'DPadCenter' || code === 13 || code === 23 || code === 32;
      const isLeft  = key === 'ArrowLeft'  || code === 37 || code === 21;
      const isRight = key === 'ArrowRight' || code === 39 || code === 22;
      const isUp    = key === 'ArrowUp'    || code === 38 || code === 19;
      const isDown  = key === 'ArrowDown'  || code === 40 || code === 20;

      if (!isStarted) {
        if (isEnter) {
          e.preventDefault();
          startApp();
        }
        return;
      }

      if (isRight || isDown) {
        e.preventDefault();
        if (webcamItems.length > 1) showIndex(cur + 1);
      } else if (isLeft || isUp) {
        e.preventDefault();
        if (webcamItems.length > 1) showIndex(cur - 1);
      } else if (isEnter) {
        e.preventDefault();
        togglePause();
      }
    });

    // Als de focus in een iframe belandt, krijgt de afstandsbediening geen toetsen meer door: haal hem terug.
    window.addEventListener('blur', () => {
      if (focusFrameEnabled) return;
      setTimeout(() => {
        const a = document.activeElement;
        if (a && a.tagName === 'IFRAME') a.blur();
        window.focus();
      }, 0);
    });

    // ---------- Start ----------
    async function init() {
      try {
        overlay.focus();
        const data = await fetchRemoteData();
        applySettings(data);
        webcamItems = data.items || [];

        if (webcamItems.length === 0) {
          infoText.innerHTML = "<span style='color:#ff4d4d;'>Geen webcam URL's gevonden!</span><br><small style='color:#aaa;'>Controleer 'webcams.list' in je GitHub repo.</small>";
        } else {
          infoText.textContent = `Rotatietijd: ${intervalInSeconds}s | Webcams: ${webcamItems.length} | Voorladen: ${preloadEnabled ? 'aan' : 'uit'}`;
        }
      } catch (err) {
        infoText.innerHTML = `<span style='color:#ff4d4d;'>Fout bij laden: ${err.message}</span>`;
      }
    }

    async function startApp() {
      if (isStarted) return;
      isStarted = true;

      requestNativeFullscreen();

      if (initPromise) {
        await initPromise;
      }

      if (webcamItems.length === 0) {
        isStarted = false;
        alert("Kan niet starten: geen geldige URL's geladen uit 'webcams.list'. Controleer je GitHub repository.");
        return;
      }

      overlay.style.display = 'none';

      activeLayer = 0;
      cur = 0;
      layers[0].el.style.opacity = '1';
      layers[0].el.style.zIndex = '2';
      layers[1].el.style.zIndex = '1';
      clearLayer(1);
      loadLayer(0, 0);

      showLabel(webcamItems[0].name);
      scheduleNudges();
      scheduleTick();
      startBackgroundSync();
      window.focus();
    }

    initPromise = init();
  </script>

</body>
</html>
