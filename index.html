<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webcam Carrousel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* Twee identieke grid-lagen over elkaar voor naadloos voorladen (double buffering) */
    .grid-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: grid;
      background-color: #000;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.5s ease-in-out;
    }
    .grid-layer.active {
      opacity: 1;
      z-index: 2;
      pointer-events: auto;
    }
    .grid-layer.zoom-container {
      z-index: 9000;
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #111;
      overflow: hidden;
    }

    /* Compact label boven in beeld met de naam van de webcam */
    .webcam-label {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: rgba(0, 0, 0, 0.62);
      color: rgba(255, 255, 255, 0.92);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: calc(100% - 24px);
      pointer-events: none;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    .iframe-wrapper.fullscreen-active .webcam-label {
      top: 22px;
      font-size: 15px;
      padding: 6px 16px;
      max-width: calc(100% - 440px);
    }

    /* Duidelijke selectierand voor navigatie met de Google TV-afstandsbediening */
    .iframe-wrapper.selected::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 4px solid #00d2ff;
      box-shadow: inset 0 0 18px rgba(0, 210, 255, 0.55);
      pointer-events: none;
      z-index: 20;
    }
    .iframe-wrapper.fullscreen-active.selected::after {
      display: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      pointer-events: none;
    }
    .click-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      z-index: 10;
    }

    /* Fullscreen zoom voor één specifieke webcam */
    .iframe-wrapper.fullscreen-active {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9001;
    }
    .iframe-wrapper.fullscreen-active iframe {
      pointer-events: auto;
    }
    .iframe-wrapper.fullscreen-active .click-overlay {
      display: none;
    }

    #back-button {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      border: 2px solid #00d2ff;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #back-button:hover, #back-button:focus {
      background: #00d2ff;
      color: #000;
      outline: none;
    }

    /* Subtiele statusmelding bij automatische achtergrond-update */
    #update-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9998;
      background: rgba(0, 0, 0, 0.85);
      color: #00d2ff;
      border: 1px solid #00d2ff;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease-in-out;
    }
    #update-toast.visible {
      opacity: 1;
    }

    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 99999;
      text-align: center;
      padding: 20px;
      outline: none;
    }
    #start-overlay h1 {
      margin-bottom: 10px;
      font-size: 2em;
    }
    #start-overlay p {
      color: #aaa;
      margin-top: 5px;
    }
    #info-text {
      color: #00d2ff;
      font-weight: bold;
      margin-top: 20px;
      font-size: 1.1em;
    }
  </style>
</head>

    <p>Dit activeert de webcam carrousel op volledig scherm</p>
    <p id="info-text">Instellingen laden...</p>
