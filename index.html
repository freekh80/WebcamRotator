<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webcam Carrousel (2x2 met Zoom)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: sans-serif;
    }
    /* 2x2 Grid Layout */
    #grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      gap: 2px;
      position: relative;
    }
    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #111;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      pointer-events: none;
    }
    .click-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      z-index: 10;
    }
    .iframe-wrapper.fullscreen-active {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9000;
    }
    .iframe-wrapper.fullscreen-active iframe {
      pointer-events: auto;
    }
    .iframe-wrapper.fullscreen-active .click-overlay {
      display: none;
    }

    #back-button {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      border: 2px solid #00d2ff;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #back-button:hover, #back-button:focus {
      background: #00d2ff;
      color: #000;
      outline: none;
    }

    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 99999;
      text-align: center;
      padding: 20px;
    }
    #start-overlay h1 {
      margin-bottom: 10px;
      font-size: 2em;
    }
    #start-overlay p {
      color: #aaa;
      margin-top: 5px;
    }
    #info-text {
      color: #00d2ff;
      font-weight: bold;
      margin-top: 20px;
      font-size: 1.1em;
    }
  </style>
</head>
<body>

  <div id="start-overlay" onclick="startApp()">
    <h1>Klik / Tik om te starten</h1>
    <p>Dit activeert de 2x2 webcam carrousel op volledig scherm</p>
    <p id="info-text">Instellingen laden...</p>
  </div>

  <button id="back-button" onclick="closeFullscreenWebcam()">← Terug naar grid</button>

  <div id="grid-container">
    <div class="iframe-wrapper" id="wrapper0">
      <div class="click-overlay" onclick="openFullscreenWebcam(0)"></div>
      <iframe id="frame0" src="about:blank" allow="autoplay; fullscreen"></iframe>
    </div>
    <div class="iframe-wrapper" id="wrapper1">
      <div class="click-overlay" onclick="openFullscreenWebcam(1)"></div>
      <iframe id="frame1" src="about:blank" allow="autoplay; fullscreen"></iframe>
    </div>
    <div class="iframe-wrapper" id="wrapper2">
      <div class="click-overlay" onclick="openFullscreenWebcam(2)"></div>
      <iframe id="frame2" src="about:blank" allow="autoplay; fullscreen"></iframe>
    </div>
    <div class="iframe-wrapper" id="wrapper3">
      <div class="click-overlay" onclick="openFullscreenWebcam(3)"></div>
      <iframe id="frame3" src="about:blank" allow="autoplay; fullscreen"></iframe>
    </div>
  </div>

  <script>
    let webcamURLs = [];
    let intervalInSeconds = 5;
    let currentBatchIndex = 0;
    let timerId = null;
    let isSingleWebcamZoomed = false;
    let activeZoomedIndex = null;
    let initPromise = null;

    const wrappers = [
      document.getElementById('wrapper0'),
      document.getElementById('wrapper1'),
      document.getElementById('wrapper2'),
      document.getElementById('wrapper3')
    ];
    const frames = [
      document.getElementById('frame0'),
      document.getElementById('frame1'),
      document.getElementById('frame2'),
      document.getElementById('frame3')
    ];
    const overlay = document.getElementById('start-overlay');
    const infoText = document.getElementById('info-text');
    const backButton = document.getElementById('back-button');

    // 1. Vraag native browser fullscreen direct aan (synchroon in de click-context)
    function requestNativeFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    }

    // 2. Haal de rotatietijd op uit config.file
    async function loadConfig() {
      try {
        const response = await fetch('config.file?t=' + Date.now());
        if (response.ok) {
          const text = await response.text();
          const match = text.match(/rotating_time\s*=\s*(\d+)/i);
          if (match && match[1]) {
            intervalInSeconds = parseInt(match[1], 10);
          }
        }
      } catch (err) {
        console.warn("Kon config.file niet laden, terugvallen op 5s:", err);
      }
    }

    // 3. Haal de webcams op uit webcams.list (afhandeling van alle regeleinden)
    async function loadWebcamList() {
      try {
        const response = await fetch('webcams.list?t=' + Date.now());
        if (response.ok) {
          const text = await response.text();
          webcamURLs = text
            .split(/\r?\n/)
            .map(line => line.trim())
            .filter(line => line.length > 0 && !line.startsWith('#'));
        } else {
          console.error("webcams.list kon niet worden geladen (HTTP " + response.status + ").");
        }
      } catch (err) {
        console.error("Fout bij laden van webcams.list:", err);
      }
    }

    // 4. Toon het volgende blok van 4 webcams
    function showNextBatch() {
      if (webcamURLs.length === 0 || isSingleWebcamZoomed) return;

      for (let i = 0; i < 4; i++) {
        const urlIndex = currentBatchIndex + i;
        if (urlIndex < webcamURLs.length) {
          frames[i].src = webcamURLs[urlIndex];
          wrappers[i].style.visibility = 'visible';
        } else {
          frames[i].src = 'about:blank';
          wrappers[i].style.visibility = 'hidden';
        }
      }

      currentBatchIndex += 4;
      if (currentBatchIndex >= webcamURLs.length) {
        currentBatchIndex = 0;
      }
    }

    // 5. Zoom in op één webcam
    function openFullscreenWebcam(index) {
      if (!frames[index].src || frames[index].src === 'about:blank') return;
      if (timerId) clearInterval(timerId);
      isSingleWebcamZoomed = true;
      activeZoomedIndex = index;
      wrappers[index].classList.add('fullscreen-active');
      backButton.style.display = 'block';
      backButton.focus();
    }

    // 6. Sluit de ingezoomde webcam
    function closeFullscreenWebcam() {
      if (!isSingleWebcamZoomed) return;
      if (activeZoomedIndex !== null) {
        wrappers[activeZoomedIndex].classList.remove('fullscreen-active');
      }
      backButton.style.display = 'none';
      isSingleWebcamZoomed = false;
      activeZoomedIndex = null;
      showNextBatch();
      timerId = setInterval(showNextBatch, intervalInSeconds * 1000);
    }

    window.addEventListener('keydown', (e) => {
      if (isSingleWebcamZoomed && (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'GoBack')) {
        closeFullscreenWebcam();
      }
    });

    // 7. Initieer gegevens bij het laden
    async function init() {
      await loadConfig();
      await loadWebcamList();

      if (webcamURLs.length === 0) {
        infoText.innerHTML = "<span style='color:#ff4d4d;'>Geen webcam URL's gevonden!</span><br><small style='color:#aaa;'>Controleer 'webcams.list' in je GitHub repo.</small>";
      } else {
        const totaalSchermen = Math.ceil(webcamURLs.length / 4);
        infoText.textContent = `Rotatietijd: ${intervalInSeconds}s | Webcams geladen: ${webcamURLs.length} (${totaalSchermen} ${totaalSchermen === 1 ? 'scherm' : 'schermen'})`;
      }
    }

    // 8. Start de app wanneer op het startscherm wordt geklikt
    async function startApp() {
      // Synchroon direct in het klik-event de fullscreen aanvragen!
      requestNativeFullscreen();

      // Wacht eventueel tot de init klaar is (als de gebruiker direct klikt)
      if (initPromise) {
        await initPromise;
      }

      if (webcamURLs.length === 0) {
        alert("Kan niet starten: geen geldige URL's geladen uit 'webcams.list'. Controleer je GitHub repository.");
        return;
      }

      // Verberg het startscherm
      overlay.style.display = 'none';

      // Start direct de eerste batch en de timer
      showNextBatch();
      if (timerId) clearInterval(timerId);
      timerId = setInterval(showNextBatch, intervalInSeconds * 1000);
    }

    // Start de init bij het laden van de pagina
    initPromise = init();
  </script>

</body>
</html>
